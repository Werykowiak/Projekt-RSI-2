services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projekt-rsi-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Pass123
    ports:
      - "1433:1433"
    networks:
      - app-network
    volumes:
      - mssql-data:/var/opt/mssql

  redis:
    image: redis:latest
    container_name: projekt-rsi-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build:
      context: ./Projekt-RSI-2-BackEnd
      dockerfile: Projekt-RSI-2-BackEnd/Dockerfile
    container_name: projekt-rsi-backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=ProjektRsiDb;User Id=sa;Password=YourStrong!Pass123;TrustServerCertificate=True
      - Redis__Configuration=redis:6379
      - Jwt__Key=TwojBardzoTajnyKluczZabezpieczajacy123!
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "7253:8080"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  frontend:
    build:
      context: ./Projekt-RSI-2-FrontEnd
      dockerfile: Dockerfile
    container_name: projekt-rsi-frontend
    environment:
      - NUXT_PUBLIC_API_BASE=http://192.168.100.2:7253
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
